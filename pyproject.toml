[project]
name = "negocio-de-pe-backend"
version = "0.1.0"
description = "Backend do Negócio de Pé — motor determinístico, context graph e agentes LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.60",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "networkx>=3.4",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pandas>=2.2",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "pyjwt>=2.10",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "langgraph-cli[inmem]>=0.3",
    "aiosqlite>=0.22.1",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
